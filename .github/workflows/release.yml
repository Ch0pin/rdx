name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: 3
  CARGO_TERM_COLOR: always
  # Keep pre-release lint/test artifacts within hosted-runner disk limits.
  # The optimized release profile is unchanged.
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_INCREMENTAL: '0'

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            platform: macos-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: '-C target-feature=+crt-static'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: release-no-debug-v1
          key: release-${{ matrix.target }}
          workspaces: |
            . -> target
            tools/androguard-helper -> target
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - name: Check formatting
        run: cargo fmt --check
      - name: Test release packaging in isolated temporary roots
        run: python -m unittest discover -s scripts/tests -v
      - name: Test bundled Python plugins
        run: python -m unittest discover -s plugins/logical-webview-inventory/tests -v
      - name: Lint
        run: cargo clippy --locked --all-targets --target ${{ matrix.target }} -- -D warnings
      - name: Test
        run: cargo test --locked --target ${{ matrix.target }}
      - name: Build
        run: cargo build --locked --release --bins --target ${{ matrix.target }}
      - name: Build pinned native Androguard helper
        if: runner.os != 'Windows'
        run: cargo build --locked --release --manifest-path tools/androguard-helper/Cargo.toml --target-dir tools/androguard-helper/target --target ${{ matrix.target }}
      - name: Smoke test pinned helper
        if: runner.os != 'Windows'
        shell: bash
        run: |
          helper="$PWD/tools/androguard-helper/target/${{ matrix.target }}/release/rdx-androguard-helper"
          "$helper" --version
          "$helper" tests/fixtures/hello.dex sample.Hello > helper-smoke.json
          python -c "import json; d=json.load(open('helper-smoke.json')); assert d['class']=='sample.Hello'; assert d['methods'][0]['id']=='sample.Hello.answer()I'; assert 'return 42;' in d['methods'][0]['java']"
          RDX_ANDROGUARD_HELPER="$helper" cargo test --locked --target ${{ matrix.target }} --test androguard_real -- --ignored
      - name: Smoke test release executable
        shell: bash
        run: |
          suffix=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then suffix=".exe"; fi
          binary="target/${{ matrix.target }}/release/rdx${suffix}"
          "$binary" --engines
          "$binary" --list tests/fixtures/hello.apk
          "$binary" --decompile tests/fixtures/hello.dex sample.Hello
      - name: Package macOS/Linux with matching-target helper
        if: runner.os != 'Windows'
        run: python scripts/package_release.py --platform ${{ matrix.platform }} --binary-dir target/${{ matrix.target }}/release --helper tools/androguard-helper/target/${{ matrix.target }}/release/rdx-androguard-helper --tag ${{ github.ref_name }}
      - name: Package Windows (fallback disabled)
        if: runner.os == 'Windows'
        run: python scripts/package_release.py --platform ${{ matrix.platform }} --binary-dir target/${{ matrix.target }}/release --tag ${{ github.ref_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Verify and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS
          sha256sum --check SHA256SUMS
          test "$(find . -maxdepth 1 -name '*.sha256' | wc -l)" -eq 4
          cd ..
          gh release create "$RELEASE_TAG" dist/*.zip dist/*.tar.gz dist/SHA256SUMS \
            --verify-tag --title "RDX $RELEASE_TAG" --prerelease \
            --notes-file "docs/releases/$RELEASE_TAG.md"
