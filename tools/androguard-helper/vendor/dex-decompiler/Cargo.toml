# RDX modification (2026-11-14): use exact vendored sibling dependencies;
# disable unused APK signing, CLI and AXML default features for the isolated helper.
[package]
name = "dex-decompiler"
version = "0.1.0"
edition = "2021"
description = "DEX to Java decompiler in pure Rust"
license = "Apache-2.0"

[dependencies]
dex-bytecode = { path = "../dex-bytecode" }
dex-parser = { path = "../dex-parser" }
apkparser = { path = "../apkparser", default-features = false }
thiserror = "2.0.18"
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
colored = "2.1"
indicatif = "0.18.3"
rayon = "1.10"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
# deflate-only so WASM builds (droid2web / dex-decompiler-wasm) stay free of zstd-sys/bzip2.
zip = { version = "0.6", default-features = false, features = ["deflate"] }

# Native mmap for path-based APK queries; omitted on wasm32 (bytes-only path).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
memmap2 = "0.9"

[lib]
name = "dex_decompiler"
path = "src/lib.rs"

[[bin]]
name = "dex-decompile"
path = "src/bin/dex-decompile.rs"
